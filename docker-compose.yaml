version: '3.8'

services:

  dexwin-postgres:
    image: pgvector/pgvector:pg16
    container_name: dt-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql

